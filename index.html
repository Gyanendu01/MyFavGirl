<!DOCTYPE html>
<html lang="en">
<head>
    <title>Do You See Something I Made For You?</title>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fff5f5;
            font-family: 'Indie Flower', cursive;
            overflow: hidden;
            background-image: radial-gradient(circle, #ffe6e6 10%, transparent 10%);
            background-size: 30px 30px;
            animation: backgroundMove 30s linear infinite;
        }

        @keyframes backgroundMove {
            0% { background-position: 0 0; }
            100% { background-position: 100px 100px; }
        }

        .container {
            text-align: center;
            background-color: rgba(255, 235, 238, 0.95);
            padding: 40px;
            border-radius: 20px;
            border: 3px solid #ff6b81;
            box-shadow: 0 8px 20px rgba(255, 107, 129, 0.3);
            max-width: 400px;
            width: 90%;
            position: relative;
            animation: containerFloat 3s ease-in-out infinite;
            backdrop-filter: blur(5px);
        }

        @keyframes containerFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .header_text {
            font-size: clamp(24px, 5vw, 36px);
            color: #ff6b81;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(255, 107, 129, 0.2);
            animation: textPulse 2s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .gif_container {
            position: relative;
            margin: 20px auto;
            max-width: 300px;
            transition: transform 0.3s ease;
        }

        .gif_container:hover {
            transform: scale(1.05);
        }

        .gif_container img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(255, 107, 129, 0.2);
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: clamp(10px, 3vw, 20px);
            flex-wrap: wrap;
        }

        .btn {
            padding: clamp(10px, 2vw, 15px) clamp(20px, 4vw, 30px);
            font-size: clamp(16px, 3vw, 20px);
            border: 2px solid #ff6b81;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #ff6b81;
            color: white;
            font-family: 'Indie Flower', cursive;
            box-shadow: 0 4px 10px rgba(255, 107, 129, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
        }

        .btn:hover::after {
            transform: rotate(45deg) translate(100%, 100%);
        }

        .btn:hover {
            background-color: white;
            color: #ff6b81;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 15px rgba(255, 107, 129, 0.4);
        }

        #noButton {
            background-color: #ff4757;
            border-color: #ff4757;
            position: relative;
        }

        .sunflower {
            position: fixed;
            font-size: 30px;
            pointer-events: none;
            z-index: 1000;
            animation: sunflowerFloat 2s ease-out forwards;
        }

        @keyframes sunflowerFloat {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
            50% {
                opacity: 0.8;
                transform: translateY(-50px) scale(1.2) rotate(180deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0.8) rotate(360deg);
            }
        }

        .video-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background-color: #fff;
            padding: clamp(15px, 3vw, 25px);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease-in-out;
            max-width: 90vw;
        }

        .video-popup.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .video-container {
            width: clamp(280px, 80vw, 500px);
            aspect-ratio: 16/9;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(255, 107, 129, 0.2);
        }

        .video-container video,
        .video-container iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 999;
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            font-size: 24px;
            color: #ff6b81;
            transition: transform 0.3s ease;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: rgba(255, 107, 129, 0.1);
        }

        .close-btn:hover {
            transform: rotate(90deg);
            background-color: rgba(255, 107, 129, 0.2);
        }

        .success-message {
            color: #ff6b81;
            font-size: clamp(20px, 4vw, 28px);
            margin-top: 15px;
            animation: messagePop 0.5s ease-out;
        }

        @keyframes messagePop {
            0% { transform: scale(0); }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
                margin: 20px;
            }
            
            .buttons {
                flex-direction: column;
                gap: 15px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header_text">Do you see something I made for you?</h1>
        <div class="gif_container">
            <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExbW5lenZyZHI5OXM2eW95b3pmMG40cWVrMDhtNjVuM3A4dGNxa2g2dSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/VM1fcpu2bKs1e2Kdbj/giphy.gif" alt="Cute GIF">
        </div>
        <div class="buttons">
            <button class="btn" id="yesButton">Yes</button>
            <button class="btn" id="noButton">No</button>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="video-popup" id="videoPopup">
        <span class="close-btn" onclick="closePopup()">×</span>
        <div class="video-container">
            <!-- <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExMmo3c3l5ODh3ZGN6NHhhaDE2Mjg1ZjkwOXczdDFxbWM3dTBtaW9zaiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/9XY4f3FgFTT4QlaYqa/giphy.gif" alt="Cute celebration"> -->
            <video id="loveVideo" controls autoplay>
                <source src="video.mp4" type="video/mp4">
            </video>
        </div>
        <div class="success-message">My Pookie 🎉💕</div>
    </div>

    <script>
        const noButton = document.getElementById('noButton');
        const yesButton = document.getElementById('yesButton');
        const videoPopup = document.getElementById('videoPopup');
        const overlay = document.getElementById('overlay');
        const video = document.getElementById('loveVideo');
        video.volume = 0.2; 

        function moveButton() {
            const buttonRect = noButton.getBoundingClientRect();
            const padding = 20;
            
            const maxX = window.innerWidth - buttonRect.width - padding;
            const maxY = window.innerHeight - buttonRect.height - padding;
            
            const x = Math.min(Math.max(padding, Math.random() * maxX), maxX);
            const y = Math.min(Math.max(padding, Math.random() * maxY), maxY);
            
            noButton.style.position = 'fixed';
            noButton.style.left = `${x}px`;
            noButton.style.top = `${y}px`;
            
            createSunflower(x + buttonRect.width/2, y + buttonRect.height/2);
        }

        function createSunflower(x, y) {
            const sunflower = document.createElement('div');
            sunflower.innerHTML = '🌻';
            sunflower.className = 'sunflower';
            sunflower.style.left = `${x}px`;
            sunflower.style.top = `${y}px`;
            document.body.appendChild(sunflower);
            
            setTimeout(() => sunflower.remove(), 2000);
        }

        function showPopup() {
            overlay.style.display = 'block';
            videoPopup.style.display = 'block';
            setTimeout(() => {
                overlay.classList.add('active');
                videoPopup.classList.add('active');
            }, 10);
        }

        function closePopup() {
            overlay.classList.remove('active');
            videoPopup.classList.remove('active');
            
            setTimeout(() => {
                overlay.style.display = 'none';
                videoPopup.style.display = 'none';
            }, 300);
        }

        noButton.addEventListener('mouseover', moveButton);
        yesButton.addEventListener('click', showPopup);

        noButton.addEventListener('click', (e) => {
            for(let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const angle = (i / 8) * 2 * Math.PI;
                    const radius = 50;
                    const offsetX = radius * Math.cos(angle);
                    const offsetY = radius * Math.sin(angle);
                    createSunflower(e.clientX + offsetX, e.clientY + offsetY);
                }, i * 100);
            }
        });

        window.addEventListener('resize', () => {
            if (noButton.style.position === 'fixed') {
                const buttonRect = noButton.getBoundingClientRect();
                const padding = 20;
                
                const maxX = window.innerWidth - buttonRect.width - padding;
                const maxY = window.innerHeight - buttonRect.height - padding;
                
                let x = parseInt(noButton.style.left);
                let y = parseInt(noButton.style.top);
                
                x = Math.min(Math.max(padding, x), maxX);
                y = Math.min(Math.max(padding, y), maxY);
                
                noButton.style.left = `${x}px`;
                noButton.style.top = `${y}px`;
            }
        });
    </script>
</body>
</html>
